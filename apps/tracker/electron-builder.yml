# How the overlay becomes something a player can download.
#
# Windows only, because the game is: Dota's console log path, the tray, and the
# always-on-top click-through window are all built against it.

appId: com.aksodame.aow5tracker
# Names the executable and the installer. Deliberately *not* in package.json:
# `app.getName()` reads `productName` there if it exists, and putting it there
# would move `app.getPath('userData')` from %APPDATA%\aow5-tracker to
# %APPDATA%\AOW5 Tracker — silently orphaning every existing user's settings
# and run archive. See the comment over `configPath` in electron/config.ts.
productName: AOW5 Tracker
copyright: Fan-made, unaffiliated with Valve or the Age of Weapons 5 authors.

directories:
  output: release
  buildResources: build

# `out/` is the whole application: electron-vite bundles main, preload and the
# renderer, and the built main imports nothing but `electron` and `node:*` — so
# no dependency has to be shipped beside it. That stays true with
# `electron-updater` in `dependencies`, because electron.vite.config.ts excludes
# it from `externalizeDepsPlugin` and bundles it in. The explicit exclusion is
# what keeps a pnpm store's worth of symlinked devDependencies out of the
# installer.
files:
  - out/**
  - package.json
  - '!node_modules/**'

asar: true

win:
  # The installer is what `electron-updater` updates: its Windows path is
  # `NsisUpdater`, which downloads and runs an `.exe`. A zip has nothing for it
  # to install, which is why auto-update waited on this target being buildable.
  #
  # It was off because `makensis` is not long-path aware and `!include` of
  # electron-builder's own NSIS headers landed at 264 characters under pnpm's
  # hashed store — four over MAX_PATH, on the GitHub runner too. The root
  # `.npmrc` caps those directory names at 50 characters, which fixes it without
  # giving up pnpm's strict isolation.
  #
  # The zip stays alongside it for anyone who will not run an installer. It
  # cannot auto-update; pressing the update button in a zip build downloads the
  # installer and converts the copy, which keeps %APPDATA% and orphans the
  # extracted folder.
  target:
    - nsis
    - zip
  icon: build/icon.png
  # SmartScreen will warn on first download either way: signing a fan tool costs
  # a certificate and a company identity, and neither is worth it at this size.
  # Said plainly in the README rather than papered over here.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AOW5 Tracker
  # The overlay keeps a tray icon and no taskbar entry, so an install that ends
  # by launching it would look like nothing happened.
  runAfterFinish: false
  # Already the default. Explicit because it is the line standing between an
  # uninstall and somebody's entire run archive, and a default is a thing that
  # can change under you.
  deleteAppDataOnUninstall: false
  # The landing's release picker prefers `setup*.exe` over everything else, so
  # this name is what makes the download button point at the installer rather
  # than the zip. Keep it in step with `pickAsset` in
  # apps/webapp/src/lib/release.ts.
  artifactName: AOW5-Tracker-Setup-${version}.${ext}

publish:
  provider: github
  # The fork's releases, not upstream's: this is the endpoint electron-updater
  # polls, and pointing it at aksodame would auto-"update" every user of the
  # Russian build back onto the English one.
  owner: yagaMI-Reverse
  repo: dota-aow5-utils-ru
  # The site reads /releases/latest and shows whatever is attached; a draft
  # would leave that button pointing at the last release instead of this one.
  #
  # `electron-updater` reads the same endpoint, so this line is also what makes
  # a `-beta` build updatable at all: with `allowPrerelease` left at its default
  # the updater only ever looks at /releases/latest, and a release marked
  # "pre-release" on GitHub is invisible to both it and the site.
  releaseType: release

# What the release page says the build contains. `private/actualize.mjs` writes
# this file on every data refresh — the newest changelog entry and only that,
# because the release is what carries the new data and a whole history in every
# release note is noise. Resolved relative to this directory.
#
# It is a normal tracked file: edit it before tagging to add anything about the
# app itself, and the next refresh will overwrite it again.
releaseInfo:
  releaseNotesFile: RELEASE_NOTES.md

# `tracker-v0.1.0-beta` is the tag; the file people download should say the same
# thing without the prefix. The installer overrides this under `nsis:` above.
artifactName: AOW5-Tracker-${version}-${os}.${ext}
